name: Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - "frameworks/**"
      - "package-lock.json"
      - "package.json"
      - "server/**"
      - "webdriver-ts/**"
      - "webdriver-ts-results/**"
  workflow_dispatch:
    inputs:
      frameworks:
        description: "Space-separated frameworks to benchmark, e.g. keyed/react non-keyed/vue. Defaults to vanilla baselines."
        required: false
        type: string
      count:
        description: "Iterations per benchmark. Keep this small for CI; official runs should use the local defaults."
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmark results
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BENCHMARK_COUNT: ${{ inputs.count || '3' }}
      INPUT_FRAMEWORKS: ${{ inputs.frameworks || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frameworks to benchmark
        id: frameworks
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_FRAMEWORKS" ]]; then
            read -r -a changed_frameworks <<< "$INPUT_FRAMEWORKS"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t changed_frameworks < <(
              git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD |
                awk -F/ '/^frameworks\/(keyed|non-keyed)\/[^/]+\// { print $2 "/" $3 }' |
                sort -u
            )
          else
            changed_frameworks=()
          fi

          run_frameworks=()
          has_keyed=false
          has_non_keyed=false

          for framework in "${changed_frameworks[@]}"; do
            [[ -z "$framework" ]] && continue
            if [[ ! -f "frameworks/${framework}/package.json" ]]; then
              echo "::error::Unknown framework '${framework}'. Expected frameworks/${framework}/package.json."
              exit 1
            fi
            run_frameworks+=("$framework")
            case "$framework" in
              keyed/*) has_keyed=true ;;
              non-keyed/*) has_non_keyed=true ;;
              *)
                echo "::error::Framework '${framework}' must start with keyed/ or non-keyed/."
                exit 1
                ;;
            esac
          done

          if [[ ${#run_frameworks[@]} -eq 0 ]]; then
            run_frameworks=("keyed/vanillajs" "non-keyed/vanillajs")
          else
            $has_keyed && run_frameworks+=("keyed/vanillajs")
            $has_non_keyed && run_frameworks+=("non-keyed/vanillajs")
          fi

          mapfile -t unique_frameworks < <(printf "%s\n" "${run_frameworks[@]}" | sort -u)
          framework_list="${unique_frameworks[*]}"

          echo "run_frameworks=${framework_list}" >> "$GITHUB_OUTPUT"
          echo "Benchmarking: ${framework_list}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            webdriver-ts/package-lock.json
            webdriver-ts-results/package-lock.json

      - name: Install benchmark tooling
        run: |
          npm ci --ignore-scripts
          npm run install-local

      - name: Ensure Chrome path
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/bin/google-chrome ]]; then
            sudo ln -s "$(command -v google-chrome-stable)" /usr/bin/google-chrome
          fi
          /usr/bin/google-chrome --version

      - name: Build benchmark implementations
        env:
          RUN_FRAMEWORKS: ${{ steps.frameworks.outputs.run_frameworks }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a frameworks <<< "$RUN_FRAMEWORKS"
          node -e 'import("./cli/rebuild-build-single.js").then(({ rebuildFrameworks }) => process.exit(rebuildFrameworks(process.argv.slice(1), true) ? 0 : 1));' "${frameworks[@]}"

      - name: Start benchmark server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/js-framework-benchmark-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

          for _ in {1..60}; do
            if curl -fsS http://localhost:8080/ls > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/js-framework-benchmark-server.log
          exit 1

      - name: Run benchmarks
        env:
          RUN_FRAMEWORKS: ${{ steps.frameworks.outputs.run_frameworks }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a frameworks <<< "$RUN_FRAMEWORKS"
          cd webdriver-ts
          npm run bench -- --runner playwright --headless true --count "$BENCHMARK_COUNT" --framework "${frameworks[@]}"

      - name: Build results HTML
        run: npm run results

      - name: Stop benchmark server
        if: always()
        shell: bash
        run: |
          if [[ -n "${SERVER_PID:-}" ]]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          if-no-files-found: warn
          path: |
            webdriver-ts/results/
            webdriver-ts/results.json
            webdriver-ts-results/src/results.ts
            webdriver-ts-results/dist/
